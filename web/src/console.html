<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domino · hospital agent</title>
<style>
/*@FONTS@*/
/*@SHARED@*/
/*@THINKCSS@*/
body { background: #fbfbf9; color: var(--body); min-height: 100vh; display: flex; flex-direction: column; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; width: 100%; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.band { padding: 22px 0 6px; }
.band .eyebrow { color: #5b6b82; font-size: 15px; }
.band h1 { margin: 2px 0 0; font-weight: 700; font-size: 30px; color: var(--heading); letter-spacing: -.01em; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; padding-top: 18px; padding-bottom: 40px; flex: 1; align-items: start; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
#seq { max-width: 720px; }
.idle { border: 2px dashed #cfd6df; border-radius: 8px; padding: 30px; text-align: center; color: #5b6b82; }
.idle b { display: block; font-size: 22px; color: var(--heading); margin-bottom: 4px; }
.idle .dot { margin-right: 8px; }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
.card { background: #fff; border: 2px solid var(--divider); border-radius: 8px; padding: 14px 16px; }
.card h2 { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5b6b82; display: flex; align-items: center; gap: 8px; }
.card h2 svg { width: 14px; height: 14px; color: var(--heading); }
.files { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 13px; }
.files li { padding: 4px 8px; border-radius: 4px; transition: background .4s; display: flex; justify-content: space-between; gap: 8px; }
.files li.read { background: #e6f4ef; }
.files li.read::after { content: "read"; font-family: var(--font); font-size: 11px; font-weight: 700; color: #0E7C61; }
.walls { margin-top: 8px; font-size: 12px; color: #9aa5b8; }
.ledger { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.ledger li { padding: 5px 0; border-bottom: 1px solid #f1f3f6; display: flex; justify-content: space-between; }
.ledger li:last-child { border-bottom: 0; }
.muted { color: #8a97b5; font-size: 13px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
table.t th { text-align: left; font-weight: 500; color: #6b778c; padding: 4px; border-bottom: 1px solid var(--divider); }
table.t td { padding: 5px 4px; border-bottom: 1px solid #f1f3f6; }
table.t tr.pass td { background: #e6f4ef; }
.ok { color: #0E7C61; font-weight: 700; } .bad { color: #B3261E; font-weight: 700; }
footer.foot { background: var(--navy); color: #fff; padding: 16px 0; }
footer.foot .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
footer.foot .private { font-weight: 700; letter-spacing: .06em; font-size: 13px; }
footer.foot .fine { font-size: 12px; color: var(--tint); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="wordmark">DOMINO</span></div>
  <div class="right"><span class="pill"><span class="dot" id="dot"></span><span id="pillText"></span></span></div>
</header>
<div class="stripe"></div>
<section class="band"><div class="wrap"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div></section>

<main class="wrap">
  <div class="seq" id="seq"></div>
  <aside class="side">
    <div class="card"><h2 id="podTitle"></h2><ul class="files" id="files"><li class="muted" style="font-family:var(--font)">not opened yet</li></ul><div class="walls" id="walls"></div></div>
    <div class="card"><h2>Sent to Alder</h2><ul class="ledger" id="ledger"><li class="muted">nothing yet</li></ul></div>
  </aside>
</main>

<footer class="foot"><div class="wrap">
  <span class="private">PRIVATE · NEVER LEAVES THIS HOSPITAL</span>
  <button class="btn outline" id="replayBtn" hidden>Replay recorded run</button>
  <span class="fine">Fictional patients · synthetic data</span>
</div></footer>

<script>/*@SOURCE@*/</script>
<script>/*@THINKJS@*/</script>
<script>
const RECORDINGS = /*@RECORDINGS@*/;
const HOSP = {
  harbor: { name: 'Harbor Point Hospital', short: 'Harbor Point', city: 'Oakland', rulebook: 'HPH-LD-12' },
  riverbend: { name: 'Riverbend General', short: 'Riverbend', city: 'Sacramento', rulebook: 'SW-TX-07' },
};
const $ = id => document.getElementById(id);
const { esc } = Think;
const chip = b => `<span class="chip ${b}">${b}</span>`;
const mmdd = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
let me = new URLSearchParams(location.search).get('h') || window.DEFAULT_HOSPITAL || 'harbor';

let log = new Think.Log(), run = null, reads = new Set(), files = [], ledger = [], runId = null;
const scroll = () => { const last = $('seq').lastElementChild; last?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };

function idle() {
  $('seq').innerHTML = `<div class="idle"><b><span class="dot on"></span>Waiting for Alder's form</b>Starts on its own when Alder clicks <i>Find an exchange</i>.</div>`;
}
function renderPod() {
  const h = HOSP[me];
  $('podTitle').innerHTML = `${Think.LOCK} ${esc(h.short)} pod`;
  if (!files.length) return;
  $('files').innerHTML = files.map(f => `<li class="${reads.has(f) ? 'read' : ''}"><span>${esc(f)}</span></li>`).join('');
  $('walls').innerHTML = `Only this pod is mounted. ${Object.keys(HOSP).filter(k => k !== me).map(k => `<s>${HOSP[k].short}</s>`).join(' · ')} · <s>Alder</s>: not reachable`;
}
function renderLedger() {
  $('ledger').innerHTML = ledger.length ? ledger.map(l => `<li><span>${l.t} · 5 fields</span><span>${l.bytes} B</span></li>`).join('') : '<li class="muted">nothing yet</li>';
}

function onEvent(e, fast = false) {
  if (!e || (e.who && e.who !== me)) return;
  if (e.type === 'flower.message' && e.direction === 'in') start(e, fast);
  if (e.type === 'pod.open') { files = e.files; reads = new Set(); renderPod(); }
  if (e.type === 'pod.read') { reads.add(e.file); renderPod(); }
  if (e.type === 'reply.ready') { ledger.unshift({ t: new Date((e.t || Date.now() / 1000) * 1000).toTimeString().slice(0, 5), bytes: e.bytes }); renderLedger(); }
  log.push(e);
}

function start(first, fast) {
  run?.cancel();
  log = new Think.Log();
  run = new Think.Run(fast);
  runId = first.run_id;
  pill();
  $('seq').innerHTML = '';
  play(run).catch(err => { if (err !== Think.CANCEL) console.error(err); });
}

async function play(R) {
  const host = $('seq'), h = HOSP[me];
  const is = t => e => e.type === t;
  const opt = { scroll };

  const con = Think.connect({ name: 'Flower', working: 'Connecting…', done: 'Connected to the exchange network',
    chips: [{ name: 'SuperNode', color: '#0E7C61' }, { name: `${h.short} pod`, color: '#0C7AC9' }, { name: 'Other pods', color: '#8A97B5' }] });
  host.appendChild(con.el);
  await R.wait(350); con.set(0, 'ok', 'connected');
  await R.wait(350); con.set(1, 'ok', 'mounted');
  await R.wait(350); con.set(2, 'off', 'unreachable'); con.finish();
  await R.wait(500);

  const form = await Think.step(R, host, { working: "Receiving Alder's form…", done: "Received Alder's form" }, log.waitFor(is('form.received'), R),
    e => ({ html: true, result: `Donor ${chip(e.request.donor.blood)} · patient ${chip(e.request.patient.blood)} · ${mmdd(e.request.window.from)}–${mmdd(e.request.window.to)} · no names` }), opt);

  await Think.step(R, host, { working: 'Opening our pod…', done: 'Opened our pod' }, log.waitFor(is('pod.open'), R),
    e => {
      const notes = e.files.filter(f => f.startsWith('availability/')).length;
      return { result: `${pairsCount()} pairs · ${notes} notes · 1 rulebook`, lock: true };
    }, opt);

  await Think.step(R, host, { working: 'Searching our records…', done: 'Searched our records' }, log.waitFor(is('retrieve'), R),
    e => ({ result: `Closest: ${e.hits.map(x => x.id).join(' · ')}` }), opt);

  const sc = await Think.step(R, host, { working: 'Screening every pair…', done: 'Screened every pair' }, log.waitFor(is('screen'), R),
    e => {
      const both = e.rows.find(r => r.reciprocal), one = e.rows.find(r => r.receive.ok);
      return { result: both ? `${both.patient_name} + ${both.donor_name} fit both ways` : one ? `None both ways · ${one.donor_name} fits one way` : 'None fit',
        details: screenTable(e) };
    }, opt);

  const both = sc.rows.find(r => r.reciprocal);
  let reply;
  if (both) {
    const rd = await Think.step(R, host, { working: 'Checking readiness…', done: 'Ready in the window' }, log.waitFor(is('readiness'), R),
      e => ({ ok: e.status === 'ready', title: e.status === 'ready' ? 'Ready in the window' : 'Not ready', result: `${both.donor_name} free ${mmdd(e.header.available_from)}–${mmdd(e.header.available_to)} · work-up done · ${e.rules.slice(0, 2).join(' ')}` }), opt);
    await Think.reason(R, host, [`Alder's donor fits ${both.patient_name}.`, `${both.donor_name} fits Alder's patient.`, `Ready ${mmdd(form.request.window.from)}–${mmdd(form.request.window.to)}.`, '→ Candidate found.'], opt);
    reply = await log.waitFor(is('reply.ready'), R);
    host.appendChild(Think.conclusion({ label: 'Conclusion', text: 'Candidate found', tone: 'ok',
      extra: `<div class="muted">Alder gets a token, not a name: <b style="color:#0A3C6E">${esc(reply.response.candidate_token)}</b></div>` }));
    void rd;
  } else {
    const one = sc.rows.find(r => r.receive.ok);
    await Think.step(R, host, { working: 'Checking our rulebook…', done: `Rulebook ${h.rulebook}` }, log.waitFor(is('outreach'), R),
      e => ({ result: `${e.rule}: no local match → widen the search` }), opt);
    const out = log.find(is('outreach'));
    await Think.step(R, host, { working: 'Reaching partner regions…', done: 'Asked partner regions' }, Promise.resolve(out),
      e => ({ html: true, result: `<span class="regions2">${e.regions.map(r => `<span>${esc(r.split(' (')[1]?.replace(')', '') || r)}</span>`).join('')}<span style="border-style:solid">illustrative</span></span>` }), opt);
    await Think.reason(R, host, [`Alder's donor is type ${form.request.donor.blood}.`, 'None of our patients can take it.', one ? `${one.donor_name} could help Alder's patient, one way only.` : 'Nothing fits either way.', '→ No candidate. Widen the search.'], opt);
    reply = await log.waitFor(is('reply.ready'), R);
    host.appendChild(Think.conclusion({ label: 'Conclusion', text: 'No candidate found', tone: 'warn' }));
  }
  scroll();
  await R.wait(700);
  const r = reply.response;
  await Think.step(R, host, { accent: 'blue', working: 'Replying over Flower…', done: 'Sent to Alder' }, Promise.resolve(reply),
    () => ({ html: true, result: `<span class="fields5">${Object.entries(r).map(([k, v]) => `<span>${k}</span><span>${esc(v === '' ? '—' : String(v))}</span>`).join('')}</span><div class="muted" style="margin-top:6px">${reply.bytes} bytes · exactly 5 fields · nothing else left ${esc(h.short)}</div>` }), opt);
}
function pairsCount() { const s = log.find(e => e.type === 'pod.read' && e.file === 'pairs.json'); return s ? parseInt(s.detail, 10) : 4; }
function screenTable(e) {
  const c = x => `${x.abo ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'}${x.crossmatch ? '<span class="ok">✓</span>' : `<span class="bad">✗</span> <span style="font-family:var(--font-mono)">${x.conflicts.join(' ')}</span>`}`;
  return `<table class="t"><tr><th>Pair</th><th>Patient</th><th>Donor</th><th>Alder donor → ours</th><th>Ours → Alder patient</th></tr>${e.rows.map(r => `<tr class="${r.reciprocal ? 'pass' : ''}"><td>${r.pair_id}</td><td>${esc(r.patient_name)} ${chip(r.patient_blood)}</td><td>${esc(r.donor_name)} ${chip(r.donor_blood)}</td><td>${c(r.give)}</td><td>${c(r.receive)}</td></tr>`).join('')}</table>`;
}

function pill() {
  $('dot').className = 'dot ' + (Source.live ? 'on' : 'warn');
  $('pillText').textContent = Source.live ? `LIVE · Flower SuperNode${runId ? ' · run ' + runId : ''}` : `REPLAY · Flower run ${RECORDINGS[me]?.run_id ?? ''}`;
}
function init() {
  const h = HOSP[me];
  document.title = `${h.short} · Domino`;
  $('eyebrow').textContent = `Private agent · ${h.city}`;
  $('title').textContent = h.name;
  renderPod(); renderLedger(); idle(); pill();
  if (!Source.live && RECORDINGS[me]) { $('replayBtn').hidden = false; $('replayBtn').onclick = () => Source.replay(RECORDINGS[me].events.map(e => ({ ...e }))); }
}
Source.on((e, meta) => {
  if (meta.catchUp) {  // show the latest run this machine took part in, instantly
    const evs = meta.events.filter(x => x.who === me);
    const i = evs.map(x => x.type === 'flower.message' && x.direction === 'in').lastIndexOf(true);
    if (i >= 0) evs.slice(i).forEach(x => onEvent(x, true));
    return;
  }
  onEvent(e);
});
fetch('/config').then(r => r.json()).then(c => { if (c.hospital && HOSP[c.hospital] && c.hospital !== me) { me = c.hospital; init(); } }).catch(() => {});
init();
</script>
</body>
</html>
