<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domino · hospital agent</title>
<style>
/*@FONTS@*/
/*@SHARED@*/
/*@THINKCSS@*/
body { background: #fbfbf9; color: var(--body); min-height: 100vh; display: flex; flex-direction: column; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 28px; width: 100%; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.band { padding: 22px 0 6px; }
.band .eyebrow { color: #5b6b82; font-size: 15px; }
.band h1 { margin: 2px 0 0; font-weight: 700; font-size: 30px; color: var(--heading); letter-spacing: -.01em; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; padding-top: 18px; padding-bottom: 40px; flex: 1; align-items: start; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
#seq { max-width: 720px; }
.idle { border: 2px dashed #cfd6df; border-radius: 8px; padding: 30px; text-align: center; color: #5b6b82; }
.idle b { display: block; font-size: 22px; color: var(--heading); margin-bottom: 4px; }
.idle .dot { margin-right: 8px; }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
.card { background: #fff; border: 2px solid var(--divider); border-radius: 8px; padding: 14px 16px; }
.card h2 { margin: 0 0 8px; font-size: 14px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #5b6b82; display: flex; align-items: center; gap: 8px; }
.card h2 svg { width: 14px; height: 14px; color: var(--heading); }
.files { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 13px; }
.files li { padding: 4px 8px; border-radius: 4px; transition: background .4s; display: flex; justify-content: space-between; gap: 8px; }
.files li.read { background: #e6f4ef; }
.files li.read::after { content: "read"; font-family: var(--font); font-size: 11px; font-weight: 700; color: #0E7C61; }
.walls { margin-top: 8px; font-size: 12px; color: #9aa5b8; }
.ledger { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.ledger li { padding: 5px 0; border-bottom: 1px solid #f1f3f6; display: flex; justify-content: space-between; }
.ledger li:last-child { border-bottom: 0; }
.muted { color: #8a97b5; font-size: 13px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
table.t th { text-align: left; font-weight: 500; color: #6b778c; padding: 4px; border-bottom: 1px solid var(--divider); }
table.t td { padding: 5px 4px; border-bottom: 1px solid #f1f3f6; }
table.t tr.pass td { background: #e6f4ef; }
.ok { color: #0E7C61; font-weight: 700; } .bad { color: #B3261E; font-weight: 700; }
.round { margin-top: 14px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #5b6b82; border-top: 2px solid var(--divider); padding-top: 12px; }
.decide { border: 2px solid #0A3C6E; background: #fff; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.decide .dh { display: flex; justify-content: space-between; font-weight: 800; color: #0A3C6E; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
.decide .dh .cd { font-weight: 500; text-transform: none; letter-spacing: 0; color: #5b6b82; }
.decide .btn.secondary { align-self: flex-start; }
.decide.done { border-color: #A7D8C9; }
footer.foot { background: var(--navy); color: #fff; padding: 16px 0; }
footer.foot .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
footer.foot .private { font-weight: 700; letter-spacing: .06em; font-size: 13px; }
footer.foot .fine { font-size: 12px; color: var(--tint); }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="wordmark">DOMINO</span></div>
  <div class="right"><span class="pill"><span class="dot" id="dot"></span><span id="pillText"></span></span></div>
</header>
<div class="stripe"></div>
<section class="band"><div class="wrap"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div></section>

<main class="wrap">
  <div class="seq" id="seq"></div>
  <aside class="side">
    <div class="card"><h2 id="podTitle"></h2><ul class="files" id="files"><li class="muted" style="font-family:var(--font)">not opened yet</li></ul><div class="walls" id="walls"></div></div>
    <div class="card"><h2>Sent to Alder</h2><ul class="ledger" id="ledger"><li class="muted">nothing yet</li></ul></div>
  </aside>
</main>

<footer class="foot"><div class="wrap">
  <span class="private">PRIVATE · NEVER LEAVES THIS HOSPITAL</span>
  <button class="btn outline" id="replayBtn" hidden>Replay recorded run</button>
  <span class="fine">Fictional patients · synthetic data</span>
</div></footer>

<script>/*@SOURCE@*/</script>
<script>/*@THINKJS@*/</script>
<script>/*@FEEDJS@*/</script>
<script>
const RECORDINGS = /*@RECORDINGS@*/;
const HOSP = {
  alder: { name: 'Alder Medical Center', short: 'Alder', city: 'San Jose', rulebook: 'AMC-KTP-04' },
  harbor: { name: 'Harbor Point Hospital', short: 'Harbor Point', city: 'Oakland', rulebook: 'HPH-LD-12' },
  riverbend: { name: 'Riverbend General', short: 'Riverbend', city: 'Sacramento', rulebook: 'SW-TX-07' },
};
const $ = id => document.getElementById(id);
const { esc } = Think;
const chip = b => `<span class="chip ${b}">${b}</span>`;
const mmdd = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
let me = new URLSearchParams(location.search).get('h') || window.DEFAULT_HOSPITAL || 'harbor';

let feed = null, reads = new Set(), files = [], ledger = [], runId = null;
const scroll = () => { const last = $('seq').lastElementChild; last?.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };
function idle() {
  $('seq').innerHTML = `<div class="idle"><b><span class="dot on"></span>Waiting for Alder</b>Starts on its own when a Flower message arrives.</div>`;
}
function renderPod() {
  const h = HOSP[me];
  $('podTitle').innerHTML = `${Think.LOCK} ${esc(h.short)} pod`;
  if (!files.length) return;
  $('files').innerHTML = files.map(f => `<li class="${reads.has(f) ? 'read' : ''}"><span>${esc(f)}</span></li>`).join('');
  $('walls').innerHTML = `Only this pod is mounted. ${Object.keys(HOSP).filter(k => k !== me).map(k => `<s>${HOSP[k].short}</s>`).join(' · ')}: not reachable`;
}
function renderLedger() {
  $('ledger').innerHTML = ledger.length ? ledger.map(l => `<li><span>${l.t} · ${esc(l.kind)}</span><span>${l.bytes} B</span></li>`).join('') : '<li class="muted">nothing yet</li>';
}
function onEvent(e) {
  if (!e || (e.who && e.who !== me)) return;
  if (e.run_id) { runId = e.run_id; pill(); }
  // a new search starts the story over on this screen
  if (!feed || (e.type === 'flower.message' && e.direction === 'in' && e.kind === 'profiles')) {
    $('seq').innerHTML = ''; feed = AgentFeed($('seq'), me, { post: Source.post, scroll });
  }
  if (e.type === 'pod.open') { files = e.files; renderPod(); }
  if (e.type === 'pod.read') { reads.add(e.file); renderPod(); }
  if (e.type === 'flower.message' && e.direction === 'out') { ledger.unshift({ t: new Date((e.t || Date.now() / 1000) * 1000).toTimeString().slice(0, 5), kind: e.kind, bytes: e.bytes }); renderLedger(); }
  feed.push(e);
}
function pill() {
  $('dot').className = 'dot ' + (Source.live ? 'on' : 'warn');
  $('pillText').textContent = Source.live ? `LIVE · Flower SuperNode${runId ? ' · run ' + runId : ''}` : `REPLAY · Flower run ${RECORDINGS[me]?.run_id ?? ''}`;
}
function init() {
  const h = HOSP[me];
  document.title = `${h.short} · Domino`;
  $('eyebrow').textContent = `Private agent · ${h.city}`;
  $('title').textContent = h.name;
  renderPod(); renderLedger(); idle(); pill();
  if (!Source.live && RECORDINGS[me]) { $('replayBtn').hidden = false; $('replayBtn').onclick = () => Source.replay(RECORDINGS[me].events.map(e => ({ ...e }))); }
}
Source.on((e, meta) => {
  if (meta.catchUp) return;
  onEvent(e);
});
fetch('/config').then(r => r.json()).then(c => { if (c.hospital && HOSP[c.hospital] && c.hospital !== me) { me = c.hospital; init(); } }).catch(() => {});
if (me === 'alder') me = 'harbor';
init();
</script>
</body>
</html>
