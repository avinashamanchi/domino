/* Domino shared tokens + components (design language borrowed from unos.org, not its brand) */
:root {
  --navy: #0E2740;
  --navy-2: #13345C;
  --navy-3: #1B4F8A;
  --heading: #0A3C6E;
  --blue: #0C7AC9;
  --blue-press: #015B98;
  --band-1: #2B6CB0;
  --band-2: #1F5A99;
  --pale: #EEF2F6;
  --white: #FFFFFF;
  --divider: #E6E6E6;
  --tint: #C4E4F7;
  --teal: #4FA3A5;
  --orange: #EC8017;
  --gold: #F2B632;
  --offline: #8A97B5;
  --body: #333333;
  --county: #13345C;
  --county-stroke: #1F4A7A;
  --shadow: 0 2px 8px rgba(14, 39, 64, .12);
  --font: "Ubuntu", Helvetica, Arial, sans-serif;
  --font-cond: "Ubuntu Condensed", "Ubuntu", Helvetica, Arial, sans-serif;
  --font-mono: "Ubuntu Mono", ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; font-family: var(--font); -webkit-font-smoothing: antialiased; }
button { font-family: var(--font); }

/* 1 · Top bar + teal stripe */
.topbar {
  height: 64px; background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: space-between; padding: 0 32px;
}
.brand { display: flex; align-items: baseline; gap: 14px; }
.wordmark { font-weight: 700; font-size: 26px; letter-spacing: .06em; }
.brand .sub { font-style: italic; font-size: 14px; color: var(--tint); }
.topnav { display: flex; gap: 28px; align-items: center; }
.topnav span { font-weight: 500; font-size: 14px; color: #fff; letter-spacing: .02em; }
.topnav span.on { color: var(--gold); }
.stripe { height: 6px; background: var(--teal); }

/* Eyebrow + display type */
.eyebrow { font-style: italic; font-weight: 400; color: var(--tint); }
.display { font-weight: 700; text-transform: uppercase; line-height: 1.05; margin: 0; }

/* 6 · Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--blue); color: #fff; border: 0; border-radius: 3px;
  font-weight: 500; font-size: 16px; padding: 12px 18px; cursor: pointer;
}
.btn:hover { background: var(--blue-press); }
.btn:active { background: var(--blue-press); }
.btn.secondary { background: #fff; color: var(--heading); border: 1px solid var(--divider); }
.btn.secondary:hover { background: var(--pale); }
.btn.outline { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .7); }
.btn.outline:hover { background: rgba(255, 255, 255, .08); }
.btn.locked, .btn:disabled { background: var(--offline); color: #fff; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

/* Blood-bag chips */
.chip {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; height: 26px; padding: 0 8px; border-radius: 3px;
  font-weight: 700; font-size: 14px; color: #1a1a1a;
}
.chip.O { background: #2F6FED; color: #fff; }
.chip.A { background: #F2C94C; }
.chip.B { background: #F28DB2; }
.chip.AB { background: #F3F4F6; }

/* Link pill (connection state) */
.pill {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500;
  padding: 5px 10px; border-radius: 3px; border: 1px solid rgba(255, 255, 255, .25); color: #fff;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); display: inline-block; }
.dot.on { background: var(--teal); box-shadow: 0 0 0 3px rgba(79, 163, 165, .25); }
.dot.warn { background: var(--gold); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

body { background: #fff; color: var(--body); min-height: 100vh; display: flex; flex-direction: column; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; width: 100%; }
.topbar .right { display: flex; align-items: center; gap: 14px; }
.topbar .hosp { font-weight: 500; font-size: 14px; }
.crumbs { height: 32px; background: var(--divider); font-size: 13px; display: flex; align-items: center; }
.crumbs .wrap { display: flex; gap: 8px; }
.band { background: var(--pale); padding: 24px 0 20px; border-bottom: 1px solid var(--divider); }
.band .eyebrow { color: #5b6b82; font-size: 15px; }
.band h1 { margin: 4px 0 6px; font-weight: 500; font-size: 32px; color: var(--heading); }
.band p { margin: 0; max-width: 900px; line-height: 1.5; }
main.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; padding-top: 24px; padding-bottom: 40px; flex: 1; }
.col-main { grid-column: span 8; min-width: 0; }
.col-side { grid-column: span 4; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (max-width: 1000px) { .col-main, .col-side { grid-column: span 12; } }
.card { background: #fff; border-radius: 3px; box-shadow: var(--shadow); border: 1px solid #edf0f4; overflow: hidden; }
.card > header { padding: 12px 18px; border-bottom: 1px solid var(--divider); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card > header h2 { margin: 0; font-size: 17px; font-weight: 500; color: var(--heading); }
.card > header .meta { font-size: 12px; color: #6b778c; }
.card .body { padding: 14px 18px; }
.muted { color: #6b778c; font-size: 13px; }
.mono { font-family: var(--font-mono); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #fff; background: var(--navy); padding: 3px 7px; border-radius: 2px; }

/* Answer banner */
.answer { border-radius: 3px; padding: 22px 26px; background: var(--navy); color: #fff; position: relative; overflow: hidden; margin-bottom: 20px; }
.answer::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--offline); }
.answer .eyebrow { font-size: 14px; }
.answer .big { font-weight: 700; text-transform: uppercase; font-size: 40px; line-height: 1.05; margin: 6px 0 8px; }
.answer .small { color: var(--tint); font-size: 15px; }
.answer.yes::before { background: var(--teal); } .answer.yes .big em { color: var(--teal); font-style: normal; }
.answer.no::before { background: var(--gold); } .answer.no .big em { color: var(--gold); font-style: normal; }
.answer.working::before { background: var(--blue); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* Vertical flowchart */
.flow { position: relative; list-style: none; margin: 0; padding: 0; }
.flow::before { content: ""; position: absolute; left: 17px; top: 20px; bottom: 20px; width: 2px; background: var(--divider); }
.flow > li { position: relative; display: grid; grid-template-columns: 36px 1fr; gap: 14px; margin-bottom: 16px; opacity: .35; transition: opacity .4s; }
.flow > li.on { opacity: 1; }
.flow .n { width: 36px; height: 36px; border-radius: 50%; background: #fff; border: 2px solid var(--divider); color: var(--heading); display: flex; align-items: center; justify-content: center; font-weight: 700; z-index: 1; }
.flow li.on .n { border-color: var(--gold); }
.flow li.done .n { background: var(--teal); border-color: var(--teal); color: #fff; }
.flow .card > header h2 small { font-weight: 400; color: #6b778c; font-size: 13px; margin-left: 6px; }
.flow .empty { color: #8a97b5; font-style: italic; font-size: 14px; }

.fields { display: flex; flex-wrap: wrap; gap: 6px; }
.field { font-family: var(--font-mono); font-size: 13px; background: var(--pale); border: 1px solid var(--divider); padding: 3px 7px; border-radius: 3px; }
.field b { color: var(--heading); }
.pod { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: start; }
.files { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 13px; }
.files li { display: flex; justify-content: space-between; gap: 10px; padding: 5px 8px; border-radius: 3px; transition: background .4s; }
.files li.read { background: #e6f4f4; }
.files li span:last-child { font-family: var(--font); color: #2d7f81; font-size: 12px; }
.walls { margin-top: 10px; font-size: 13px; color: #6b778c; display: flex; gap: 8px; flex-wrap: wrap; }
.walls span { border: 1px dashed #c9d0da; padding: 3px 8px; border-radius: 3px; }
.walls span s { color: #9aa5b8; }
.hits { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.hit { display: grid; grid-template-columns: 120px 1fr 90px; gap: 10px; align-items: center; font-size: 13px; }
.hit .id { font-family: var(--font-mono); color: var(--heading); }
.hit .txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 6px; background: var(--pale); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 500; color: #6b778c; padding: 6px; border-bottom: 1px solid var(--divider); }
table.t td { padding: 7px 6px; border-bottom: 1px solid #f1f3f6; vertical-align: middle; }

<script>/* Where a page's events come from.
 *  LIVE:   served by this Mac's bridge → long-poll /events (events come from this Mac's own Flower process).
 *  REPLAY: opened as a file, or no bridge → play a recorded real Flower run embedded at build time.
 * The badge always says which one.
 */
const Source = (() => {
  const live = location.protocol.startsWith('http') && !new URLSearchParams(location.search).has('replay');
  let seq = 0;
  let handler = () => {};
  let playing = null;
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function poll() {
    for (;;) {
      try {
        const res = await fetch(`/events?since=${seq}&wait=20`, { cache: 'no-store' });
        const j = await res.json();
        const catchUp = seq === 0;
        seq = j.seq;
        if (catchUp) handler(null, { catchUp: true, events: j.events });
        else j.events.forEach(e => handler(e, {}));
      } catch {
        await sleep(1500);
      }
    }
  }

  async function replay(events, { speed = 1, maxGap = 2200 } = {}) {
    const token = {};
    playing = token;
    for (let i = 0; i < events.length; i++) {
      if (playing !== token) return;
      const gap = i ? Math.min(maxGap, Math.max(0, (events[i].t - events[i - 1].t) * 1000)) / speed : 0;
      if (gap) await sleep(gap);
      if (playing !== token) return;
      handler(events[i], { replay: true });
    }
    playing = null;
  }

  return {
    live,
    on(f) { handler = f; if (live) poll(); },
    replay,
    stop() { playing = null; },
    async post(path, body = {}) {
      if (!live) return { ok: false, offline: true };
      try {
        const r = await fetch(path, { method: 'POST', body: JSON.stringify(body) });
        return await r.json();
      } catch { return { ok: false }; }
    },
  };
})();
</script>

function step(i, html, meta, done = true) {
  for (let j = 0; j <= i; j++) $('st' + j).classList.add('on');
  if (done) $('st' + i).classList.add('done');
  if (html != null) $('sb' + i).innerHTML = html;
  if (meta != null) $('sm' + i).textContent = meta;
  $('st' + i).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function answer(i, html) { const el = $('qa' + i); el.classList.remove('pending'); el.innerHTML = html; }

function renderPod() {
  const h = HOSP[me];
  step(1, `<div class="pod">
      <svg width="64" height="76" viewBox="0 0 64 76" aria-hidden="true"><ellipse cx="32" cy="12" rx="26" ry="9" fill="#EEF2F6" stroke="#4FA3A5" stroke-width="3"/><path d="M6 12v50c0 5 12 9 26 9s26-4 26-9V12" fill="#EEF2F6" stroke="#4FA3A5" stroke-width="3"/><path d="M6 37c0 5 12 9 26 9s26-4 26-9" fill="none" stroke="#4FA3A5" stroke-width="3"/><rect x="24" y="46" width="16" height="13" rx="2" fill="#0E2740"/><path d="M27 46v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#0E2740" stroke-width="2.5"/></svg>
      <div><div class="mono" style="font-size:13px; color:#0A3C6E">${esc(S.podRoot || '')}</div>
      <ul class="files">${S.files.map(f => `<li class="${S.reads.has(f) ? 'read' : ''}"><span>${esc(f)}</span><span>${S.reads.has(f) ? esc(S.readDetail?.[f] || 'read') : ''}</span></li>`).join('')}</ul>
      <div class="walls"><span>${h.short}'s pod: <b>mounted</b></span>${Object.keys(HOSP).filter(k => k !== me).map(k => `<span><s>${HOSP[k].short}'s pod</s> not reachable from this machine</span>`).join('')}<span><s>Alder's pod</s> not reachable</span></div></div></div>`,
    `${S.reads.size} of ${S.files.length} files read`);
}

function onEvent(e) {
  if (!e || (e.who && e.who !== me)) return;
  switch (e.type) {
    case 'hello': break;
    case 'flower.message':
      if (e.direction === 'in') { reset(); S.runId = e.run_id; S.msg = e; step(0, null, `run ${e.run_id} · msg ${String(e.message_id).slice(0, 8)}`, false); banner('working', 'Working · on this machine', 'Filling Alder\'s form…', 'Only this hospital\'s pod is open.'); pill(); }
      break;
    case 'form.received': {
      if (!S.msg) { reset(); S.runId = e.run_id; }
      const r = e.request; S.request = r;
      step(0, `<div class="fields">
        <span class="field">request_id=<b>${esc(r.request_id)}</b></span>
        <span class="field">donor=<b>${esc(r.donor.token)}</b> ${chip(r.donor.blood)} <b>${r.donor.hla.join(' ')}</b></span>
        <span class="field">patient=<b>${esc(r.patient.token)}</b> ${chip(r.patient.blood)} avoid <b>${r.patient.unacceptable_antigens.join(' ')}</b></span>
        <span class="field">window=<b>${r.window.from} → ${r.window.to}</b></span></div>
        <p class="muted" style="margin:10px 0 0">${e.bytes} bytes from Alder. No names, no charts, no notes.</p>`, S.msg ? undefined : `run ${e.run_id}`);
      break;
    }
    case 'pod.open': S.podRoot = e.root; S.files = e.files; S.readDetail = {}; renderPod(); $('st1').classList.remove('done'); break;
    case 'pod.read': S.reads.add(e.file); S.readDetail = { ...(S.readDetail || {}), [e.file]: e.detail }; renderPod(); break;
    case 'retrieve': {
      const idx = S.screen ? 4 : 2;
      const max = e.hits[0]?.score || 1;
      const html = `<div class="muted">${esc(e.purpose)} · query: <span class="mono">${esc(e.query)}</span> · searched ${e.searched}</div>
        <div class="hits">${e.hits.map(h => `<div class="hit"><span class="id">${esc(h.id)}</span><span class="txt">${esc(h.text.split('\n')[0].slice(0, 120))}</span><span class="bar" title="BM25 ${h.score}"><i style="width:${(100 * h.score / max).toFixed(0)}%"></i></span></div>`).join('')}</div>`;
      if (idx === 2) step(2, html, 'BM25 · on this machine');
      else { S.ruleHits = e.hits; S.retrieveHtml = html; step(4, html, 'rulebook', false); }
      break;
    }
    case 'screen': {
      S.screen = e;
      const cell = c => `${c.abo ? '<span class="ok">✓</span>' : '<span class="bad">✗</span>'} blood · ${c.crossmatch ? '<span class="ok">✓</span> xm' : `<span class="bad">✗</span> xm <span class="mono">${c.conflicts.join(' ')}</span>`}`;
      step(3, `<table class="t"><tr><th>Pair</th><th>Our patient</th><th>Alder donor ${chip(e.request_donor_blood)} → our patient</th><th>Our donor → Alder patient ${chip(e.request_patient_blood)}</th><th></th></tr>
        ${e.rows.map(r => `<tr class="${r.reciprocal ? 'pass' : ''}"><td class="mono">${r.pair_id}</td><td><span class="av">${r.patient_initials}</span>${chip(r.patient_blood)} <span class="av">${r.donor_initials}</span>${chip(r.donor_blood)}</td><td>${cell(r.give)}</td><td>${cell(r.receive)}</td><td>${r.reciprocal ? '<span class="ok">both ways</span>' : ''}</td></tr>`).join('')}</table>
        <p class="muted" style="margin:8px 0 0">Code, not a model: ABO rules and antigen lists. All ${e.rows.length} pairs checked.</p>`, `${e.rows.filter(r => r.reciprocal).length} reciprocal`);
      const give = e.rows.filter(r => r.give.ok), recv = e.rows.filter(r => r.receive.ok), both = e.rows.find(r => r.reciprocal);
      answer(0, both ? `Yes · pair ${both.pair_id} (<span class="av">${both.patient_initials}</span> blood ${both.patient_blood}), crossmatch negative` : give.length ? `Yes · ${give.map(r => r.pair_id).join(', ')}` : `No · none of our ${e.rows.length} patients`);
      answer(1, both ? `Yes · <span class="av">${both.donor_initials}</span> blood ${both.donor_blood} → Alder's patient, crossmatch negative` : recv.length ? `Only one way · <span class="av">${recv[0].donor_initials}</span> (blood ${recv[0].donor_blood}) could give to Alder's patient` : 'No');
      break;
    }
    case 'readiness': {
      const c = e.checks;
      step(4, `${S.retrieveHtml || ''}
        <table class="t" style="margin-top:10px"><tr><th>Check</th><th>From</th><th></th></tr>
        <tr><td>Donor available in the window</td><td class="mono">${esc(e.note)} · ${e.header.available_from} → ${e.header.available_to}</td><td class="${c.window_overlap ? 'ok' : 'bad'}">${c.window_overlap ? '✓' : '✗'}</td></tr>
        <tr><td>Work-up complete, under 12 months</td><td class="mono">${esc(e.header.workup)} · §1.1</td><td class="${c.workup_complete ? 'ok' : 'bad'}">${c.workup_complete ? '✓' : '✗'}</td></tr>
        <tr><td>Recipient active on the list</td><td class="mono">pairs.json · §1.2</td><td class="${c.recipient_active ? 'ok' : 'bad'}">${c.recipient_active ? '✓' : '✗'}</td></tr></table>
        ${e.quote ? `<div class="quote">${esc(e.quote)}<cite>${esc(e.note)}</cite></div>` : ''}`, `readiness: ${e.status}`);
      answer(2, `${e.status === 'ready' ? 'Ready' : e.status.replace('_', ' ')} · overlap ${e.overlap ? e.overlap.join(' → ') : 'none'}`);
      const rule = (S.ruleHits || []).find(h => /paired exchange/i.test(h.text));
      answer(3, rule ? `Allowed · ${HOSP[me].rulebook} ${rule.id}, both surgeons must sign` : 'See rulebook');
      break;
    }
    case 'decision':
      step(4, `<div class="quote" style="border-color:#F2B632">${esc(e.detail)}<cite>reason: ${esc(e.reason)}</cite></div>${S.retrieveHtml || ''}`, 'no reciprocal match', false);
      answer(2, 'Not applicable · no candidate');
      break;
    case 'outreach': {
      const rule = (S.ruleHits || []).find(h => h.id === e.rule);
      step(4, `<div class="quote" style="border-color:#F2B632">No reciprocal match here. Our rulebook says what to do next:<cite>${HOSP[me].rulebook} ${esc(e.rule)}</cite></div>
        ${rule ? `<div class="quote">${esc(rule.text.split('\n').slice(1).join(' '))}<cite>${HOSP[me].rulebook} ${esc(e.rule)}</cite></div>` : ''}
        <div class="regions">${e.regions.map((r, i) => `<div class="region" style="animation: none"><span>Search forwarded to ${esc(r)}</span><span id="rg${i}">sending…</span></div>`).join('')}</div>
        <p class="muted" style="margin:8px 0 0">${esc(e.note)}</p>`, 'widening the search');
      e.regions.forEach((_, i) => setTimeout(() => { const el = $('rg' + i); if (el) el.textContent = 'sent · awaiting reply'; }, 700 + i * 600));
      answer(3, `${HOSP[me].rulebook} ${esc(e.rule)} · widen the search to partner regions`);
      break;
    }
    case 'reply.ready': {
      const r = e.response;
      step(5, `<pre class="wire">${esc(JSON.stringify(r, null, 1))}</pre><div class="okline">Allowlist passed: exactly ${e.fields.length} fields · ${e.bytes} bytes · sent to Alder over Flower</div>`, `${e.bytes} B`);
      S.ledger.unshift({ t: clock(), fields: e.fields, bytes: e.bytes, run: S.runId });
      $('ledger').innerHTML = S.ledger.map(l => `<li><span>→ ${l.t} · reply · ${l.fields.join(', ')}</span><span>${l.bytes} B</span></li>`).join('');
      $('ledgerMeta').textContent = `${S.ledger.length} repl${S.ledger.length === 1 ? 'y' : 'ies'}`;
      if (r.candidate_found) banner('yes', `Replied · run ${S.runId}`, '<em>Candidate found</em>', `Sent: token ${esc(r.candidate_token)} · ${r.readiness} · ${r.reason}. The pair's names, HLA and notes stayed here.`);
      else banner('no', `Replied · run ${S.runId}`, '<em>No candidate found</em>', `Sent: ${r.readiness.replaceAll('_', ' ')} · ${r.reason.replaceAll('_', ' ')}. Nothing else left this hospital.`);
      break;
    }
    case 'refused': banner('no', 'Refused', 'Form rejected', esc(e.error)); break;
  }
}

function pill() {
  $('dot').className = 'dot ' + (Source.live ? 'on' : 'warn');
  $('pillText').textContent = Source.live ? `LIVE · Flower SuperNode${S.runId ? ' · run ' + S.runId : ''}` : `REPLAY · recorded Flower run ${RECORDINGS[me]?.run_id ?? ''}`;
}
function init() {
  const h = HOSP[me];
  document.title = `${h.short} · Domino`;
  $('hospName').textContent = `${h.name} · ${h.city}`;
  $('crumbs').innerHTML = `<span>${h.name}</span> » <span>Transplant</span> » <b>Exchange requests</b>`;
  $('eyebrow').textContent = `Private console · ${h.city}`;
  $('title').textContent = h.name;
  $('lede').textContent = `This hospital's agent runs on this machine, inside ${h.short}'s Flower SuperNode. It can open exactly one data pod: ${h.short}'s. Whatever Alder asks, the only thing that goes back is a five-field reply.`;
  reset(); pill();
  if (!Source.live && RECORDINGS[me]) { $('replayBtn').hidden = false; $('replayBtn').onclick = () => { reset(); Source.replay(RECORDINGS[me].events); }; }
}
Source.on((e, meta) => {
  if (meta.catchUp) {  // show the latest run this machine took part in
    const evs = meta.events.filter(x => x.who === me);
    const start = evs.map(x => x.type === 'flower.message' && x.direction === 'in').lastIndexOf(true);
    if (start >= 0) { const hold = S.ledger; evs.slice(start).forEach(onEvent); S.ledger = hold; }
    return;
  }
  onEvent(e);
});
fetch('/config').then(r => r.json()).then(c => { if (c.hospital && HOSP[c.hospital]) { me = c.hospital; init(); } }).catch(() => {});
init();
</script>
</body>
</html>
